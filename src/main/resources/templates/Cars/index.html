<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Lista de Carros</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container pt-3">

    <a th:href="@{/cars/new}" class="btn btn-primary float-end">
        Novo Carro
    </a>

    <h1>Lista de Carros (<span th:text="${size}">0</span>)</h1>

    <hr>

    <table class="table">

        <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Marca</th>
            <th scope="col">Modelo</th>
            <th scope="col">Ano</th>
            <th scope="col">Ações</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="car : ${cars}">

            <th scope="row" th:text="${car.id}">1</th>

            <td th:text="${car.marca}">Toyota</td>

            <td th:text="${car.modelo}">Corolla</td>

            <td th:text="${car.ano}">2024</td>

            <td>
                <a th:href="@{|/cars/show/${car.id}|}"
                   class="btn btn-danger">
                    Detalhes
                </a>
            </td>

        </tr>

        </tbody>

    </table>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
